<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FlowTimer · FlowTherapy</title>
<style>
:root{font-family:system-ui,sans-serif;color:#edf8ff;background:#071b29;color-scheme:dark;--accent:#78d4ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#173c54,#071b29 70%)}main{width:min(100%,1000px);padding:32px 24px;text-align:center}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:36px}.brand{text-align:left;letter-spacing:.06em;font-size:19px}.brand small{display:block;font-size:12px;color:#9dbace;margin-top:5px;letter-spacing:.15em}button,input{font:inherit}button{cursor:pointer;border:1px solid #436177;background:#163448;color:inherit;border-radius:14px;padding:13px 20px;min-height:48px}button:hover{background:#244a63}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:disabled{opacity:.45;cursor:default}.presets{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.presets button[aria-pressed=true]{color:#072337;background:#a5e4ff;border-color:#a5e4ff}.clock{font-size:clamp(72px,17vw,180px);font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.055em;line-height:1.1;margin:35px 0 8px;color:var(--accent)}.status{font-size:20px;color:#b4cede;min-height:30px}.track{height:5px;border-radius:5px;background:#274458;margin:26px auto;max-width:650px;overflow:hidden}.progress{height:100%;width:100%;background:var(--accent)}.actions{display:flex;justify-content:center;gap:12px;margin:26px 0}#start{min-width:155px;background:#8dd9fa;color:#082131;font-weight:700;border:0}.custom{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;color:#b4cede;margin-top:30px}.custom input{width:90px;border-radius:10px;padding:12px;background:#102e42;border:1px solid #436177;color:white}.note{color:#9dbace;font-size:14px;margin-top:30px;line-height:1.6}body.warning{--accent:#f3c27b}body.finished{--accent:#ffb6a4}body.finished .status{color:#ffb6a4}@media(max-width:500px){main{padding:24px 16px}header{margin-bottom:26px}.presets{gap:8px}.presets button{padding:11px 14px}header button{padding:10px;font-size:14px}}
</style></head><body><main>
<header><div class="brand">FlowTimer<small>FLOWTHERAPY · SESSION TIMER</small></div><button id="fullscreen">Full screen</button></header>
<div class="presets" aria-label="Session length">
<button data-min="15" aria-pressed="false">15 min</button><button data-min="30" aria-pressed="false">30 min</button><button data-min="45" aria-pressed="false">45 min</button><button data-min="60" aria-pressed="false">60 min</button><button data-min="75" aria-pressed="true">75 min</button><button data-min="90" aria-pressed="false">90 min</button><button data-min="120" aria-pressed="false">120 min</button>
</div>
<div class="clock" id="clock" role="timer" aria-label="Time remaining">75:00</div><div class="status" id="status" role="status">Ready when you are</div>
<div class="track" aria-hidden="true"><div class="progress" id="progress"></div></div>
<div class="actions"><button id="start">Start session</button><button id="reset">Reset</button></div>
<form class="custom" id="custom"><label for="minutes">Custom minutes</label><input id="minutes" type="number" min="1" max="600" step="1" value="75" required><button type="submit">Set time</button></form>
<p class="note">Silent by design. Amber at 5 minutes; coral when time is up.<br>Keep this window visible and your laptop awake during the session.</p>
</main><script>
'use strict';
const clock=document.querySelector('#clock'),status=document.querySelector('#status'),start=document.querySelector('#start'),progress=document.querySelector('#progress'),minutes=document.querySelector('#minutes');
const KEY='flowtherapy.timer.v1';let state={duration:75*60000,remaining:75*60000,end:null,running:false};let wakeLock=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function left(){return state.running?Math.max(0,state.end-Date.now()):state.remaining}
async function keepAwake(){if('wakeLock' in navigator&&state.running&&document.visibilityState==='visible'){try{wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}}
function releaseAwake(){if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}}
function paint(){let ms=left();if(state.running&&ms===0){state.remaining=0;state.running=false;state.end=null;save();releaseAwake()}const sec=Math.ceil(ms/1000);clock.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');document.title=clock.textContent+' · FlowTimer';document.body.classList.toggle('warning',ms>0&&ms<=300000);document.body.classList.toggle('finished',ms===0);status.textContent=ms===0?'Session complete':state.running?(ms<=300000?'Five minutes or less remaining':'Session in progress'):(ms===state.duration?'Ready when you are':'Paused');start.textContent=state.running?'Pause':ms===0?'Start again':ms===state.duration?'Start session':'Resume';progress.style.width=(ms/state.duration*100)+'%';document.querySelectorAll('[data-min]').forEach(b=>{b.disabled=state.running;b.setAttribute('aria-pressed',String(Number(b.dataset.min)*60000===state.duration))});document.querySelector('#custom button').disabled=state.running;minutes.disabled=state.running}
function setDuration(min){if(state.running)return;state={duration:min*60000,remaining:min*60000,end:null,running:false};minutes.value=min;save();paint()}
start.addEventListener('click',()=>{if(state.running){state.remaining=left();state.running=false;state.end=null;releaseAwake()}else{if(state.remaining<=0)state.remaining=state.duration;state.end=Date.now()+state.remaining;state.running=true;keepAwake()}save();paint()});
document.querySelector('#reset').addEventListener('click',()=>{if(state.running&&!confirm('Stop and reset this session?'))return;releaseAwake();state.running=false;setDuration(state.duration/60000)});
document.querySelectorAll('[data-min]').forEach(b=>b.addEventListener('click',()=>setDuration(Number(b.dataset.min))));
document.querySelector('#custom').addEventListener('submit',e=>{e.preventDefault();const m=Number(minutes.value);if(Number.isInteger(m)&&m>=1&&m<=600)setDuration(m)});
const full=document.querySelector('#fullscreen');if(!document.documentElement.requestFullscreen)full.hidden=true;full.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){status.textContent='Use your browser’s full-screen option.'}});document.addEventListener('fullscreenchange',()=>full.textContent=document.fullscreenElement?'Exit full screen':'Full screen');
try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&Number.isFinite(old.duration)&&old.duration>=60000&&old.duration<=36000000&&Number.isFinite(old.remaining)&&old.remaining>=0&&old.remaining<=old.duration&&typeof old.running==='boolean'&&(!old.running||Number.isFinite(old.end)))state=old}catch(e){}
minutes.value=state.duration/60000;document.addEventListener('visibilitychange',()=>{paint();keepAwake()});paint();keepAwake();setInterval(paint,250);
</script></body></html>
